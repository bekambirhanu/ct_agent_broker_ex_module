[project]
name = "ct_agent_broker_ex_module"
version = "0.1.0"
description = "Broker adapter for Exness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "shared",
    "ct_agent_nlp_parser_module",
]

[tool.uv.sources]
shared = { workspace = true }
ct_agent_nlp_parser_module = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["broker_exness"]
